<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TheRing - Game Hub</title>
    <link rel="stylesheet" href="hub-style.css">
</head>
<body>
    <div class="hub-wrapper">
        <!-- Header -->
        <header class="hub-header">
            <div class="hub-header-content">
                <h1 class="hub-title">
                    <span class="title-icon">🎮</span>
                    <span class="title-text">TheRing</span>
                </h1>
                <p class="hub-subtitle">Game Hub - Quản lý và chơi tất cả các game</p>
            </div>
        </header>

        <!-- Main Content -->
        <main class="hub-main">
            <div class="hub-container">
                <!-- Games Grid -->
                <div id="gamesGrid" class="games-grid">
                    <!-- Games will be loaded dynamically -->
                </div>

                <!-- Loading State -->
                <div id="loadingState" class="loading-state">
                    <div class="spinner"></div>
                    <p>Đang tải danh sách game...</p>
                </div>

                <!-- Empty State -->
                <div id="emptyState" class="empty-state" style="display: none;">
                    <div class="empty-icon">🎲</div>
                    <h2>Chưa có game nào</h2>
                    <p>Thêm game vào thư mục để hiển thị tại đây</p>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="hub-footer">
            <p>&copy; 2024 TheRing Game Hub. Tất cả các game đều miễn phí.</p>
        </footer>
    </div>

    <script src="hub-manager.js"></script>
</body>
</html>
