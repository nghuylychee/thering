<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DiceRogue Map Editor</title>
    <style>
        :root {
            --bg: #1a1b26;
            --panel: #24283b;
            --accent: #7aa2f7;
            --text: #c0caf5;
            --cell-size: 48px;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .editor-header {
            padding: 12px 16px;
            background: var(--panel);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .editor-header h1 { margin: 0; font-size: 1.25rem; color: var(--accent); }
        .editor-body { display: flex; flex: 1; min-height: 0; }
        .toolbar {
            width: 260px;
            background: var(--panel);
            border-right: 1px solid rgba(255,255,255,0.08);
            padding: 12px;
            overflow-y: auto;
        }
        .toolbar-section {
            margin-bottom: 16px;
        }
        .toolbar-section label { display: block; font-size: 0.75rem; text-transform: uppercase; opacity: 0.8; margin-bottom: 6px; }
        .toolbar-category { font-size: 0.8rem; color: var(--accent); margin-top: 12px; }
        .toolbar-category:first-of-type { margin-top: 0; }
        .toolbar-hint { font-size: 0.7rem; opacity: 0.7; margin: 0 0 8px 0; }
        .theme-block { margin-bottom: 12px; }
        .theme-block-title { font-size: 0.75rem; font-weight: 600; margin-bottom: 6px; opacity: 0.9; }
        .theme-block .brush-grid { grid-template-columns: repeat(2, 1fr); }
        .toolbar input[type="number"] { width: 70px; padding: 6px 8px; background: var(--bg); border: 1px solid rgba(255,255,255,0.15); border-radius: 6px; color: var(--text); }
        .toolbar select { width: 100%; padding: 8px; background: var(--bg); border: 1px solid rgba(255,255,255,0.15); border-radius: 6px; color: var(--text); }
        .brush-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
        }
        .brush-grid-decor { grid-template-columns: repeat(4, 1fr); }
        .brush-btn {
            aspect-ratio: 1;
            padding: 2px;
            min-width: 0;
            max-width: 36px;
            max-height: 36px;
            margin: 0 auto;
            border: 2px solid transparent;
            border-radius: 6px;
            background: var(--bg);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: border-color 0.15s;
        }
        .brush-btn:hover { border-color: rgba(255,255,255,0.3); }
        .brush-btn.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
        .brush-btn img { width: 100%; height: 100%; object-fit: contain; }
        .brush-btn .emoji { font-size: 1rem; }
        .zoom-controls {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .zoom-controls .btn-zoom { padding: 4px 10px; font-size: 1.1rem; line-height: 1; }
        .zoom-value { font-size: 0.85rem; min-width: 3em; text-align: center; }
        .btn-row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
        .btn {
            padding: 8px 14px;
            border: none;
            border-radius: 6px;
            background: var(--accent);
            color: #fff;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .btn:hover { filter: brightness(1.1); }
        .btn.secondary { background: rgba(255,255,255,0.12); color: var(--text); }
        .btn.danger { background: #f7768e; }
        .canvas-wrap {
            flex: 1;
            overflow: auto;
            padding: 24px;
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }
        #mapGrid {
            display: grid;
            gap: 0;
            background: #0f0f14;
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 4px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.4);
        }
        .map-cell {
            width: var(--cell-size);
            height: var(--cell-size);
            position: relative;
            cursor: crosshair;
            border: 1px solid rgba(255,255,255,0.06);
            overflow: visible;
        }
        .decor-overlay {
            position: absolute;
            left: 0;
            top: 0;
            background-size: cover;
            background-position: center;
            z-index: 1;
            pointer-events: none;
        }
        .map-cell:hover { background: rgba(122, 162, 247, 0.15); }
        .map-cell .terrain-bg {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
        }
        .map-cell .overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            pointer-events: none;
            z-index: 2;
        }
        .map-cell .overlay img { width: 80%; height: 80%; object-fit: contain; }
        .file-input { display: none; }
        .status { font-size: 0.85rem; opacity: 0.9; }
    </style>
</head>
<body>
    <div class="editor-header">
        <a href="index.html" class="btn secondary" style="margin-right: 8px;">← Main menu</a>
        <h1>🗺️ DiceRogue Map Editor</h1>
        <span class="zoom-controls">
            <button type="button" class="btn secondary btn-zoom" id="zoomOut" title="Thu nhỏ">−</button>
            <span class="zoom-value" id="zoomValue">100%</span>
            <button type="button" class="btn secondary btn-zoom" id="zoomIn" title="Phóng to">+</button>
        </span>
        <span class="status" id="status">Chọn brush và vẽ lên grid. Export ra dicerogue-map.json</span>
    </div>
    <div class="editor-body">
        <aside class="toolbar">
            <div class="toolbar-section">
                <label>Kích thước map</label>
                <div class="btn-row">
                    <input type="number" id="mapWidth" value="12" min="4" max="40">
                    <span>×</span>
                    <input type="number" id="mapHeight" value="12" min="4" max="40">
                    <button type="button" class="btn" id="btnResize">Áp dụng</button>
                </div>
            </div>
            <div class="toolbar-section">
                <label>Theme (chọn để hiện brush Terrain / Decor)</label>
                <select id="themeSelect"></select>
            </div>
            <div class="toolbar-section">
                <label class="toolbar-category">Terrain (nền ô)</label>
                <p class="toolbar-hint">Nền đi được (floor) hoặc tường (wall) theo theme.</p>
                <div id="terrainByTheme"></div>
            </div>
            <div class="toolbar-section">
                <label class="toolbar-category">Decor (trang trí)</label>
                <p class="toolbar-hint">Trang trí đơn ô hoặc nhiều ô theo theme.</p>
                <div id="decorByTheme"></div>
            </div>
            <div class="toolbar-section">
                <label class="toolbar-category">Layout (entity)</label>
                <p class="toolbar-hint">Player, quái, item, ô đặc biệt.</p>
                <div class="brush-grid" id="layoutBrushes"></div>
            </div>
            <div class="toolbar-section">
                <label>File</label>
                <div class="btn-row">
                    <input type="file" class="file-input" id="fileLoad" accept=".json">
                    <button type="button" class="btn secondary" id="btnLoad">Load JSON</button>
                    <button type="button" class="btn" id="btnSave">Export JSON</button>
                    <button type="button" class="btn" id="btnPlaytest" title="Mở game với bản đồ hiện tại">Chơi thử</button>
                </div>
            </div>
        </aside>
        <div class="canvas-wrap">
            <div id="mapGrid"></div>
        </div>
    </div>
    <script src="config.js"></script>
    <script src="assets-config.js"></script>
    <script src="map-editor.js"></script>
</body>
</html>
