<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DiceRogue - Asset System Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1a2332;
            color: white;
            padding: 20px;
        }
        .test-section {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            margin: 20px 0;
            border-radius: 10px;
        }
        .test-item {
            display: inline-block;
            margin: 10px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            text-align: center;
            min-width: 150px;
        }
        .test-item h4 {
            margin: 10px 0 5px 0;
            font-size: 14px;
            color: #ffd700;
        }
        .asset-display {
            width: 120px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 10px auto;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
        }
        .asset-display img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .status.success {
            background: rgba(46, 204, 113, 0.3);
            color: #2ecc71;
        }
        .status.error {
            background: rgba(231, 76, 60, 0.3);
            color: #e74c3c;
        }
        .status.info {
            background: rgba(52, 152, 219, 0.3);
            color: #3498db;
        }
        button {
            padding: 10px 20px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #2980b9;
        }
    </style>
</head>
<body>
    <h1>🎨 DiceRogue Asset System Test</h1>
    
    <div class="test-section">
        <h2>System Status</h2>
        <div id="systemStatus" class="status info">Initializing...</div>
        <button onclick="testAssetManager()">Test Asset Manager</button>
        <button onclick="testRendering()">Test Rendering</button>
        <button onclick="testFallback()">Test Emoji Fallback</button>
    </div>
    
    <div class="test-section">
        <h2>Player Assets</h2>
        <div id="playerAssets" class="test-item">
            <h4>Player (Idle)</h4>
            <div class="asset-display" id="playerIdle"></div>
        </div>
    </div>
    
    <div class="test-section">
        <h2>Enemy Assets</h2>
        <div id="enemyAssets"></div>
    </div>
    
    <div class="test-section">
        <h2>Item Assets</h2>
        <div id="itemAssets"></div>
    </div>
    
    <div class="test-section">
        <h2>UI Assets</h2>
        <div id="uiAssets"></div>
    </div>
    
    <div class="test-section">
        <h2>Console Log</h2>
        <div id="consoleLog" style="background: rgba(0,0,0,0.5); padding: 10px; border-radius: 5px; font-family: monospace; font-size: 12px; max-height: 200px; overflow-y: auto;"></div>
    </div>

    <script src="config.js"></script>
    <script src="assets-config.js"></script>
    <script src="assets-helper.js"></script>
    
    <script>
        // Console logger
        const originalLog = console.log;
        const originalError = console.error;
        const originalWarn = console.warn;
        const logDiv = document.getElementById('consoleLog');
        
        function addLog(message, type = 'log') {
            const logEntry = document.createElement('div');
            logEntry.style.color = type === 'error' ? '#e74c3c' : type === 'warn' ? '#f39c12' : '#ecf0f1';
            logEntry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logDiv.appendChild(logEntry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }
        
        console.log = function(...args) {
            originalLog.apply(console, args);
            addLog(args.join(' '), 'log');
        };
        
        console.error = function(...args) {
            originalError.apply(console, args);
            addLog(args.join(' '), 'error');
        };
        
        console.warn = function(...args) {
            originalWarn.apply(console, args);
            addLog(args.join(' '), 'warn');
        };
        
        // Test functions
        function updateStatus(message, type = 'info') {
            const statusDiv = document.getElementById('systemStatus');
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
        }
        
        async function testAssetManager() {
            updateStatus('Testing Asset Manager...', 'info');
            console.log('=== Testing Asset Manager ===');
            
            try {
                // Test config
                if (typeof ASSETS_CONFIG === 'undefined') {
                    throw new Error('ASSETS_CONFIG not found');
                }
                console.log('✓ ASSETS_CONFIG loaded');
                
                // Test asset manager
                if (typeof assetManager === 'undefined') {
                    throw new Error('assetManager not found');
                }
                console.log('✓ assetManager initialized');
                
                // Test helper functions
                if (typeof renderPlayer === 'undefined') {
                    throw new Error('renderPlayer function not found');
                }
                console.log('✓ Helper functions loaded');
                
                updateStatus('Asset Manager: OK ✓', 'success');
            } catch (error) {
                console.error('Asset Manager Test Failed:', error);
                updateStatus(`Error: ${error.message}`, 'error');
            }
        }
        
        async function testRendering() {
            updateStatus('Testing Rendering...', 'info');
            console.log('=== Testing Rendering ===');
            
            try {
                // Test player rendering
                const playerIdle = document.getElementById('playerIdle');
                renderPlayer(playerIdle);
                console.log('✓ Player rendered');
                
                // Test enemy rendering
                const enemyAssets = document.getElementById('enemyAssets');
                enemyAssets.innerHTML = '';
                
                const enemyNames = ['Giant Rat', 'Goblin', 'Orc', 'Dragon'];
                enemyNames.forEach(enemyName => {
                    const testItem = document.createElement('div');
                    testItem.className = 'test-item';
                    testItem.innerHTML = `<h4>${enemyName}</h4><div class="asset-display"></div>`;
                    const display = testItem.querySelector('.asset-display');
                    renderEnemy(display, enemyName);
                    enemyAssets.appendChild(testItem);
                });
                console.log('✓ Enemies rendered');
                
                // Test item rendering
                const itemAssets = document.getElementById('itemAssets');
                itemAssets.innerHTML = '';
                
                const itemNames = ['Small Gem', 'Treasure Ring', 'Enchanted Blade', 'Royal Crown'];
                itemNames.forEach(itemName => {
                    const testItem = document.createElement('div');
                    testItem.className = 'test-item';
                    testItem.innerHTML = `<h4>${itemName}</h4><div class="asset-display" style="width: 64px; height: 64px;"></div>`;
                    const display = testItem.querySelector('.asset-display');
                    renderItem(display, itemName);
                    itemAssets.appendChild(testItem);
                });
                console.log('✓ Items rendered');
                
                // Test UI rendering
                const uiAssets = document.getElementById('uiAssets');
                uiAssets.innerHTML = '';
                
                const uiTypes = ['gold', 'hp', 'portal', 'princess'];
                uiTypes.forEach(uiType => {
                    const testItem = document.createElement('div');
                    testItem.className = 'test-item';
                    testItem.innerHTML = `<h4>${uiType}</h4><div class="asset-display" style="width: 64px; height: 64px;"></div>`;
                    const display = testItem.querySelector('.asset-display');
                    renderUIIcon(display, uiType, 64);
                    uiAssets.appendChild(testItem);
                });
                console.log('✓ UI icons rendered');
                
                // Test dice rendering
                const diceTestItem = document.createElement('div');
                diceTestItem.className = 'test-item';
                diceTestItem.innerHTML = '<h4>Dice (Value 3)</h4><div class="asset-display" style="width: 60px; height: 60px;"></div>';
                const diceDisplay = diceTestItem.querySelector('.asset-display');
                renderDice(diceDisplay, 3, false);
                uiAssets.appendChild(diceTestItem);
                console.log('✓ Dice rendered');
                
                updateStatus('Rendering: OK ✓ (Using emoji fallback - images not loaded)', 'success');
            } catch (error) {
                console.error('Rendering Test Failed:', error);
                updateStatus(`Error: ${error.message}`, 'error');
            }
        }
        
        async function testFallback() {
            updateStatus('Testing Emoji Fallback...', 'info');
            console.log('=== Testing Emoji Fallback ===');
            
            try {
                // Temporarily disable images
                const originalUseImages = ASSETS_CONFIG.settings.useImages;
                ASSETS_CONFIG.settings.useImages = false;
                
                // Test rendering with emoji
                const testContainer = document.createElement('div');
                testContainer.style.display = 'none';
                document.body.appendChild(testContainer);
                
                renderPlayer(testContainer);
                const hasEmoji = testContainer.textContent.includes('🧙');
                console.log(`✓ Player emoji fallback: ${hasEmoji ? 'OK' : 'FAILED'}`);
                
                renderEnemy(testContainer, 'Goblin');
                const hasEnemyEmoji = testContainer.textContent.includes('👺');
                console.log(`✓ Enemy emoji fallback: ${hasEnemyEmoji ? 'OK' : 'FAILED'}`);
                
                // Restore setting
                ASSETS_CONFIG.settings.useImages = originalUseImages;
                document.body.removeChild(testContainer);
                
                updateStatus('Emoji Fallback: OK ✓', 'success');
            } catch (error) {
                console.error('Fallback Test Failed:', error);
                updateStatus(`Error: ${error.message}`, 'error');
            }
        }
        
        // Auto-run tests on load
        window.addEventListener('load', async () => {
            console.log('=== Asset System Test Page Loaded ===');
            await testAssetManager();
            await new Promise(resolve => setTimeout(resolve, 500));
            await testRendering();
            await new Promise(resolve => setTimeout(resolve, 500));
            await testFallback();
            console.log('=== All Tests Completed ===');
        });
    </script>
</body>
</html>
